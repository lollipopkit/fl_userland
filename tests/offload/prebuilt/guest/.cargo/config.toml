# `rust-lld` for the reason tests/guest/.cargo/config.toml gives: cargo would
# otherwise use the host `cc`, which on macOS is clang driving ld64, and it
# rejects the GNU linker options rustc passes for this target.
#
# `relocation-model=static` and `-no-pie` are this directory's own: the offload
# registry is keyed by guest address, and `nm` on a PIE reports a file offset
# rather than the address the program will run at.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=-no-pie"]
