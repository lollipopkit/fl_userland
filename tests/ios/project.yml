name: IulDeviceHarness
options:
  bundleIdPrefix: com.lollipopkit.iul
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SUPPORTED_PLATFORMS: iphoneos
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_DEBUG_DYLIB: NO

targets:
  IulDeviceHost:
    type: application
    platform: iOS
    sources:
      - path: Host
    info:
      path: Host/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lollipopkit.iul.devicehost
        GENERATE_INFOPLIST_FILE: NO

  IulDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../build-ios/rootfs.tar.gz
        buildPhase: resources
    dependencies:
      - target: IulDeviceHost
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
    info:
      path: Tests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lollipopkit.iul.devicetests
        GENERATE_INFOPLIST_FILE: NO
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../.."
        OTHER_CFLAGS:
          - "-DGUEST_ARM64=1"
          - "-DLOG_HANDLER_DPRINTF=1"
        OTHER_LDFLAGS:
          - "$(SRCROOT)/../../build-ios/libiul.a"
          - "-lm"
          - "-ldl"
        ENABLE_BITCODE: NO
