# Rust workspace.
#
# The emulator core, the syscall layer and the gadgets stay in C and assembly —
# see CLAUDE.md. What lives here is the code being moved to Rust, starting with
# the host-side tools that parse untrusted input.
#
# `target/` is cargo's own, and the build scripts in `tools/` use it: they honour
# `CARGO_TARGET_DIR` if it is set and otherwise share this one, so an ordinary
# `cargo test` and a `tools/build-all.sh` reuse each other's compilation rather
# than fighting over a lockfile. meson gave each of its four cargo invocations a
# directory inside `build/` and paid for it with four compiles of the workspace.
# A build with different `TMPFS_RS_CLANG_ARGS` still wants one of its own; see
# CLAUDE.md's `-DLOCK_DEBUG=1` recipe.

