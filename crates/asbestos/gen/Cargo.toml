[package]
name = "asbestos-gen"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The emulator's own types -- `cpu_state`, `tlb`, `mmu`, `fiber_block`. This
# named `crates/kernel/abi` for them until 2026-09-09, which is a crate two
# layers up naming the CPU it emulates.
emu-abi = { path = "../../emu/abi" }
# The calling thread's guest pid, for a debug line. A hook, so that a layer-0
# crate does not name a `kernel` one for it.
util-currentpid = { path = "../../util/currentpid" }
# The diagnostics globals, as a Rust call. They were an `extern "C"` block
# here, which is a dependency edge cargo cannot see.
asbestos-diag = { path = "../diag" }
util-signpost = { path = "../../util/signpost" }
util-logchan = { path = "../../util/logchan" }
emu-tlb = { path = "../../emu/tlb" }
# The cryptographic instructions, which the decoder emits as `slow_call`s.
asbestos-crypto = { path = "../crypto" }
asbestos-offloadprebuilt = { path = "../offloadprebuilt" }
# The ID register values a guest reads, from the table HWCAP is built from.
asbestos-features = { path = "../features" }
# The types, and `current` -- both the foundation's. This crate names no
# field accessor, so it does not depend on `taskview`, a layer above it.
libc = "0.2"
