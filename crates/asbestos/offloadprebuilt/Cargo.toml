[package]
name = "asbestos-offloadprebuilt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "offloadprebuilt"
crate-type = ["rlib"]

[dependencies]
# The registration table; see that crate.
util-appendonly = { path = "../../util/appendonly" }
# The IUL_* settings as a safe read; see crates/util/iulenv. The one thing
# this crate generated bindings for, so there is no build script now.
util-iulenv = { path = "../../util/iulenv" }
# `struct cpu_state` and `struct tlb`, for the one signature this crate holds.
# Nothing here dereferences either -- see `SpecFn` for why it names them anyway.
emu-abi = { path = "../../emu/abi" }
