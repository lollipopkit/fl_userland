[package]
name = "asbestos-dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "asbestos_dispatch"
crate-type = ["rlib"]

[dependencies]
# The emulator's own types -- `cpu_state`, `tlb`, `mmu`, `fiber_block`. This
# named `crates/kernel/abi` for them until 2026-09-09, which is a crate two
# layers up naming the CPU it emulates.
emu-abi = { path = "../../emu/abi" }
util-locks = { path = "../../util/locks" }
asbestos-jitstate = { path = "../jitstate" }
kernel-pagetable = { path = "../../kernel/pagetable" }
# The shared Rust types are re-exported by kernel-taskview.
# The types alone: this crate names no accessor, so it depends on the
# foundation rather than on `taskview`, which sits a layer above it.
# The IUL_* settings as a safe read; this crate generated its own struct and
# read the C global through unsafe until 2026-09-04.
util-iulenv = { path = "../../util/iulenv" }
libc.workspace = true
asbestos-blockcache = { path = "../blockcache" }
asbestos-diag = { path = "../diag" }
asbestos-gen = { path = "../gen" }
emu-tlb = { path = "../../emu/tlb" }
asbestos-offloadsym = { path = "../offloadsym" }
