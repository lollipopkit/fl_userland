[package]
name = "iul"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "iul"
# Both. The staticlib is `libiul.a`, which is what an embedder links --
# `tools/build-libs.sh` installs it; the
# rlib is what the CLI binary links, so that `crates/tools/iul` gets one copy of
# the standard library rather than its own plus the staticlib's -- which under
# the release profile's LTO are strong globals and a duplicate-symbol error.
# See the note about there being exactly one staticlib in CLAUDE.md.
crate-type = ["staticlib", "rlib"]

[features]
# The symbol-level offload test handlers, asked for with
# `--features offload-test-symbol`; a default build compiles none of it.
offload-test-symbol = ["dep:kernel-offloadtest"]
offload-test-prebuilt = ["dep:kernel-offloadtestprebuilt"]

[dependencies]
kernel-offloadtest = { path = "../kernel/offloadtest", optional = true }
kernel-offloadtestprebuilt = { path = "../kernel/offloadtestprebuilt", optional = true }
fs-bindmount = { path = "../fs/bindmount" }
