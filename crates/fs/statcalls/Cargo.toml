[package]
name = "fs-statcalls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "statcalls"
crate-type = ["rlib"]

[dependencies]
util-errno = { path = "../../util/errno" }
fs-mount = { path = "../../fs/mount" }
# The descriptor object, called as Rust. `fs/fd.h` is still the C
# declaration; nothing here goes through it.
fs-fdobj = { path = "../../fs/fdobj" }
# The shared Rust types are re-exported by kernel-taskview.
kernel-taskview = { path = "../../kernel/taskview" }
statx = { path = "../statx" }
fs-devices = { path = "../devices" }
fs-generic = { path = "../generic" }
kernel-usercopy = { path = "../../kernel/usercopy" }
util-strace = { path = "../../util/strace" }
