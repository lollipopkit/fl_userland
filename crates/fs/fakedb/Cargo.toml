[package]
name = "fs-fakedb"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fakedb"
# rlib: crates/iul is the one staticlib in the product and links this in. See
# the staticlib note in CLAUDE.md.
crate-type = ["rlib"]

[dependencies]
util-errno = { path = "../../util/errno" }
fs-fakeschema = { path = "../fakeschema" }
util-logline = { path = "../../util/logline" }
# The connection belongs to this crate now. No `bundled`: the product links
# the system sqlite3, and two sqlite3 builds in one process is a second copy
# of its global state.
rusqlite = { workspace = true, features = ["functions"] }
# The migration and the rebuild, called directly rather than through their C
# entry points: one fewer symbol resolved at link time, and it is what makes
# this crate's tests able to open a real database.
fakefs = { path = "../fakefs" }

[dev-dependencies]
# `rustix::fs::CWD`, the root a test hands `Db::open` when it reads none.
rustix.workspace = true
