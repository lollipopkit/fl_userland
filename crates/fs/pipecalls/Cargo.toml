[package]
name = "fs-pipecalls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pipecalls"
crate-type = ["rlib"]

[dependencies]
util-errno = { path = "../../util/errno" }
fs-adhoc = { path = "../../fs/adhoc" }
# `raise_sigpipe`: the one door every SIGPIPE goes through, which
# `RWF_NOSIGNAL` closes for a call.
kernel-errno = { path = "../../kernel/errno" }
kernel-creds = { path = "../../kernel/creds" }
# The descriptor object, called as Rust. `fs/fd.h` is still the C
# declaration; nothing here goes through it.
fs-fdobj = { path = "../../fs/fdobj" }
kernel-taskview = { path = "../../kernel/taskview" }
fs-pipe = { path = "../pipe" }
kernel-usercopy = { path = "../../kernel/usercopy" }
util-strace = { path = "../../util/strace" }
