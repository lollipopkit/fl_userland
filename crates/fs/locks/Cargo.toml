[package]
name = "fs-locks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fs_locks"
crate-type = ["rlib"]

[dependencies]
util-errno = { path = "../../util/errno" }
# `inode_data.state`'s guard, which the lock set sits behind.
util-guestlock = { path = "../../util/guestlock" }
# The descriptor object, called as Rust. `fs/fd.h` is still the C
# declaration; nothing here goes through it.
fs-fdobj = { path = "../../fs/fdobj" }
kernel-taskview = { path = "../../kernel/taskview" }
