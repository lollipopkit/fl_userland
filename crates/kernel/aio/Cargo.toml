[package]
name = "kernel-aio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aio"
crate-type = ["rlib"]

[dependencies]
util-errno = { path = "../../util/errno" }
util-guestlock = { path = "../../util/guestlock" }
util-strace = { path = "../../util/strace" }
util-timeabi = { path = "../../util/timeabi" }
libc.workspace = true
# The descriptor object, and the shared types through taskview.
fs-fdobj = { path = "../../fs/fdobj" }
kernel-taskview = { path = "../taskview" }
kernel-usercopy = { path = "../usercopy" }
# The ring is a kernel memfd mapped shared into the guest, the way System V
# shared memory is.
kernel-memfdcalls = { path = "../memfdcalls" }
kernel-mmapcalls = { path = "../mmapcalls" }
# The transfers an iocb asks for are the positional and stream syscalls'.
kernel-rwcalls = { path = "../rwcalls" }
rwabi = { path = "../rwabi" }
# `NoSigpipe`, for `RWF_NOSIGNAL`.
kernel-errno = { path = "../errno" }
kernel-fdattr = { path = "../fdattr" }
# IOCB_FLAG_RESFD signals an eventfd; IOCB_CMD_POLL waits on a description's
# watcher list and asks its readiness.
kernel-eventfd = { path = "../eventfd" }
fs-poll = { path = "../../fs/poll" }
fs-pollset = { path = "../../fs/pollset" }
# io_pgetevents' temporary mask.
kernel-signaldeliver = { path = "../signaldeliver" }
# IOCB_FLAG_IOPRIO is ioprio_set's rule; the CPU count sizes the ring.
kernel-procattr = { path = "../procattr" }
kernel-rescalls = { path = "../rescalls" }
