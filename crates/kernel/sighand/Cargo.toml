[package]
name = "kernel-sighand"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kernel_sighand"
# rlib: crates/iul is the one staticlib in the product and links this in. See
# the staticlib note in CLAUDE.md.
crate-type = ["rlib"]

[dependencies]
# `kernel-abi` was here until 2026-09-12 for "the opaque handle this crate
# hands out and the queue type beside it", and that reason died on 2026-09-11:
# the handle became a `*mut SigHand` and `src/abi.rs` says so above the casts.
# Nothing in this crate has named `iul_abi` since, and an unused edge is not
# free -- it is what the closure query in `crates/kernel/abi/src/fd_types.rs`
# reads to decide whether a placeholder can become its real type, so a dead one
# reports a blocker that is not there.
util-synctypes = { path = "../../util/synctypes" }
kernel-sigdisp = { path = "../sigdisp" }
kernel-sigqueue = { path = "../sigqueue" }
util-guestlock = { path = "../../util/guestlock" }
# The wait loop, for `set_signal_pending_hook`. Downward: `guestlock` above
# already stands on it.
util-waitfor = { path = "../../util/waitfor" }

[dev-dependencies]
# The real signal state, so a test runs the real `wait_for`. It ran
# `crates/util/guestlock-teststub`'s parallel one until 2026-09-08.
kernel-sighand = { path = "../sighand" }
kernel-sigqueue = { path = "../sigqueue" }
