[package]
name = "kernel-initstack"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kernel_initstack"
# rlib: crates/iul is the one staticlib in the product and links this in. See
# the staticlib note in CLAUDE.md.
crate-type = ["rlib"]

[dependencies]
elf = { path = "../elf" }
# The feature table AT_HWCAP is built from, shared with the ID registers and
# /proc/cpuinfo.
asbestos-features = { path = "../../asbestos/features" }
