[package]
name = "kernel-fdcalls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fdcalls"
crate-type = ["rlib"]

[dependencies]
util-errno = { path = "../../util/errno" }
# The SIOCGIF* family, which answers from the host interface list.
fs-netlink = { path = "../../fs/netlink" }
fs-locks = { path = "../../fs/locks" }
kernel-rlimit = { path = "../rlimit" }
# The descriptor object, called as Rust. `fs/fd.h` is still the C
# declaration; nothing here goes through it.
fs-fdobj = { path = "../../fs/fdobj" }
kernel-taskview = { path = "../../kernel/taskview" }
libc.workspace = true
fdtable = { path = "../../fs/fdtable" }
kernel-usercopy = { path = "../usercopy" }
util-plain = { path = "../../util/plain" }
kernel-creds = { path = "../creds" }
fs-inode = { path = "../../fs/inode" }
util-strace = { path = "../../util/strace" }

kernel-memfdcalls = { path = "../memfdcalls" }

fs-pipecalls = { path = "../../fs/pipecalls" }

[dev-dependencies]
