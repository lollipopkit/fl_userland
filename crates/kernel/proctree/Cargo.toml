[package]
name = "kernel-proctree"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "proctree"
# rlib: crates/iul is the one staticlib in the product and links this in. See
# the staticlib note in CLAUDE.md.
crate-type = ["rlib"]

[dependencies]
# `struct task` and `struct tgroup`, so that the handles this stores say
# what they are. Nothing here reads through one.
kernel-taskview = { path = "../taskview" }
