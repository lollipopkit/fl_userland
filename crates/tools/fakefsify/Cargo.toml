[package]
name = "fakefsify"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Two names, one binary: `tools/build-fakefsify.sh` symlinks `unfakefsify` next
# to it and the program picks import vs export from argv[0], the way the C
# version did.
[[bin]]
name = "fakefsify"
path = "src/main.rs"

[dependencies]
fs-fakeschema = { path = "../../fs/fakeschema" }
# The archive formats, in Rust: libarchive until 2026-10-17.
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
libc.workspace = true
rusqlite.workspace = true
rustix.workspace = true
